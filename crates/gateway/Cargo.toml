[package]
name = "think-watch-gateway"
version.workspace = true
edition.workspace = true

[dependencies]
# 共用层来自 thinkwatch-core（MIT）。方向是单向的：代码只能从 core
# 流向企业版，反过来不行 —— 任何进 core 的代码从此刻起就是 MIT。
tw-types = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0" }
tw-protocol = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0" }
tw-resil = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0" }
tw-dialect = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0" }
tw-upstream = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0", features = ["sigv4"] }
tw-wire = { git = "https://github.com/ThinkWatchProject/ThinkWatch-Core.git", tag = "v0.32.0" }
think-watch-common = { workspace = true }
think-watch-auth = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = "1"
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
fred = { workspace = true }
utoipa = { workspace = true }
# sha2 removed — cache now uses xxhash; HMAC signing uses hmac crate in server
regex = "1"
rand = { workspace = true }
metrics = { workspace = true }
xxhash-rust = { workspace = true }
aws-sigv4 = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-eventstream = { workspace = true }
arc-swap = { workspace = true }
http_1x = { package = "http", version = "1" }
rust_decimal = { workspace = true }
