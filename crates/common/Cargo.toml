regex = "1"
# S3-compatible body offload (matches the same SigV4 + reqwest pattern
# the Bedrock provider uses — no aws-sdk-s3 dependency, so the build
# cost stays a couple hundred LOC for what's effectively GET/PUT/DELETE
# against any S3-compatible backend including RustFS / MinIO / AWS S3).
aws-sigv4 = { workspace = true }
aws-credential-types = { workspace = true }
http_1x = { package = "http", version = "1" }
async-trait = "0.1"
