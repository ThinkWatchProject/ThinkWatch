services:
  postgres:
    image: postgres:18-alpine
    # Docker's default /dev/shm of 64MB is too small for parallel
    # workers + auto-ANALYZE under the integration suite (one
    # ephemeral DB per test, dozens of concurrent stat targets).
    # Crashes show up as `could not resize shared memory segment "/PostgreSQL.…"
    # to 33554432 bytes: No space left on device` and the container
    # eventually goes unhealthy. 512MB clears the suite with headroom.
    shm_size: 512m
    command:
      - postgres
      # --- Memory ---
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=8MB
      # --- WAL / Checkpoints ---
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=zstd
      # --- I/O ---
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # --- Connections & safety ---
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - statement_timeout=60s
      # --- Planner ---
      - -c
      - default_statistics_target=200
      - -c
      - jit=off
      # --- Slow query log (dev: log everything > 200ms) ---
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_USER: ${DB_USER:-thinkwatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-think_watch}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-thinkwatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- ClickHouse (log storage & search) ---
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    command: ["--", "--listen_host=0.0.0.0"]
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-thinkwatch}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-think_watch}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/initdb.d/:/docker-entrypoint-initdb.d/:ro
      - ./clickhouse/config.d/:/etc/clickhouse-server/config.d/:ro
      - ./clickhouse/users.d/:/etc/clickhouse-server/users.d/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Zitadel (OIDC / SSO provider for development) ---
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.13.1
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY is required (32 chars)}"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel_db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_PG_PASSWORD:?ZITADEL_PG_PASSWORD is required}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_PG_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "admin"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_ADMIN_PASSWORD:-${ZITADEL_PG_PASSWORD}!Aa1}"
      ZITADEL_TELEMETRY_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      zitadel_db:
        condition: service_healthy

  zitadel_db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - jit=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZITADEL_PG_PASSWORD:?ZITADEL_PG_PASSWORD is required}
      POSTGRES_DB: zitadel
    volumes:
      - ./data/zitadel_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- RustFS (S3-compatible object storage for audit body offload) ---
  #
  # Default backend for the audit body-offload pipeline (see
  # crates/common/src/blob_store.rs). The server reads S3_* env vars at
  # startup and points at this container when they're set; without them
  # the offload pipeline runs InlineStore (truncation only). The bucket
  # `thinkwatch-audit-bodies` is created by the rustfs_init one-shot below using
  # `mc` against the same RustFS endpoint — without it the first body
  # PUT 404s on a missing bucket and falls back to truncation forever.
  rustfs:
    image: rustfs/rustfs:latest
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      # RustFS uses the MinIO-style root credential pair. Keep them in
      # sync with S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env so
      # the server can authenticate against this bucket.
      RUSTFS_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required (used both by rustfs root creds and the gateway)}
      RUSTFS_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    ports:
      - "9100:9000"   # S3 API — host port 9100 to avoid clashing with CH native 9000
      - "9101:9001"   # Admin console (read-only browse for operators)
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      # RustFS exposes `/health` (200 OK on a live server); the
      # MinIO-style `/minio/health/live` path that earlier RustFS
      # builds answered now 403s under root-creds mode, which kept
      # the container permanently "unhealthy" — blocking the
      # `rustfs_init` one-shot and leaving the bucket uncreated.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket bootstrap. Uses the official MinIO Client (`mc`)
  # because RustFS speaks the MinIO admin API; runs to completion then
  # exits 0. Idempotent — `mb --ignore-existing` makes the second-run
  # case quiet.
  rustfs_init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-thinkwatch-audit-bodies}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://rustfs:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # Set an object-lifecycle rule that expires audit bodies at 60d
        # — a buffer over the default 30-day column TTL in CH so a
        # late-arriving body fetch still hits the bucket for a couple
        # weeks past the row's body NULL-out. Operators can override
        # by editing this file or applying their own lifecycle policy
        # against the bucket.
        cat > /tmp/lifecycle.json <<EOF
        {
          "Rules": [
            {
              "ID": "expire-audit-bodies",
              "Status": "Enabled",
              "Expiration": { "Days": 60 },
              "Filter": { "Prefix": "bodies/" }
            }
          ]
        }
        EOF
        mc ilm import "local/$$S3_BUCKET" < /tmp/lifecycle.json || true
        echo "rustfs bucket $$S3_BUCKET ready"
    restart: "no"

