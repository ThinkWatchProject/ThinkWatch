{{- if .Values.networkPolicy.enabled }}
# Server pod: allow ingress on gateway (3000) and console (3001) ports,
# and egress to PostgreSQL, Redis, ClickHouse, DNS, HTTPS and
# networkPolicy.extraEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway port — from ingress controller or any namespace
    - ports:
        - port: {{ .Values.service.gateway.port }}
          protocol: TCP
    # Console port — only from web pods and same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/component: web
      ports:
        - port: {{ .Values.service.console.port }}
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL, Redis and ClickHouse (HTTP), on the ports the server
    # connects to them on (tw.<db>.ports in _helpers.tpl)
    {{- range $db := list "postgres" "redis" "clickhouse" }}
    # {{ $db }}
    - ports:
        {{- range splitList " " (include (printf "tw.%s.ports" $db) $) }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    # OIDC provider (HTTPS)
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    # networkPolicy.extraEgress
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Web pod: allow ingress on port 80, egress only to server console port and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Server console API (reverse proxy)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/component: server
      ports:
        - port: {{ .Values.service.console.port }}
          protocol: TCP
    # Server gateway API (reverse proxy)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/component: server
      ports:
        - port: {{ .Values.service.gateway.port }}
          protocol: TCP
{{- end }}
