apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "tw.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: server
      annotations:
        # Auto-restart on config/secret change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Chart.Name }}
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Chart.Name }}
                    app.kubernetes.io/component: server
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/component: server
      {{- end }}
      initContainers:
        {{- if .Values.postgres.bundled }}
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "tw.postgres.name" . }} 5432; do echo waiting for postgres; sleep 2; done']
        {{- end }}
        {{- if .Values.redis.bundled }}
        - name: wait-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "tw.redis.name" . }} 6379; do echo waiting for redis; sleep 2; done']
        {{- end }}
        {{- if .Values.clickhouse.bundled }}
        - name: wait-clickhouse
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "tw.clickhouse.name" . }} 8123; do echo waiting for clickhouse; sleep 2; done']
        {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.server.repository }}:{{ include "tw.imageTag" (dict "tag" .Values.image.server.tag "ctx" .) }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: gateway
              containerPort: 3000
              protocol: TCP
            - name: console
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: gateway
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: gateway
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "tw.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ include "tw.imageTag" (dict "tag" .Values.image.web.tag "ctx" .) }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # nginx in this image writes to /var/run, /var/cache/nginx,
          # and /tmp at runtime. With readOnlyRootFilesystem: true (set
          # above) those paths must be backed by an emptyDir or the pod
          # fails to start with "Read-only file system" on the first
          # forked worker. Each volume is sized for normal SPA
          # operation; bump `sizeLimit` if a custom nginx.conf adds
          # heavy buffering / large file uploads.
          volumeMounts:
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          # Probe the proxied backend instead of the SPA's index.html.
          # `/` is the SPA fallback and ALWAYS returns 200 even when
          # the backend behind /api/* is unreachable — meaning a
          # broken pod still passes ready/live, traffic keeps landing
          # on it, and users see "loading…" forever.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
      volumes:
        - name: nginx-run
          emptyDir:
            sizeLimit: 4Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 32Mi
