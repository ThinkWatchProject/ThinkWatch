replicaCount: 1

image:
  server:
    repository: ghcr.io/thinkwatch/think-watch-server
    # Defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/thinkwatch/think-watch-web
    tag: ""
    pullPolicy: IfNotPresent

service:
  gateway:
    type: ClusterIP
    port: 3000
  console:
    type: ClusterIP
    port: 3001
  web:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  gateway:
    host: gateway.example.com
    tls: []
  console:
    host: console.internal.example.com
    tls: []

config:
  corsOrigins: "https://console.internal.example.com"
  rustLog: "info,think_watch=info"

# Secrets — leave empty to auto-generate on first install.
# Values are preserved across `helm upgrade` via the chart's lookup pattern.
# Override here or with --set to pin specific values.
secrets:
  jwtSecret: ""
  encryptionKey: ""
  # Bearer token gating the `/metrics` endpoint. Leave empty to
  # auto-generate; set explicitly if Prometheus is scraping from a
  # different cluster / namespace and you want to manage the secret
  # there.
  metricsBearerToken: ""

# Prometheus metrics endpoint. When `metricsBearerToken` is set (auto
# or explicit), the server installs the Prometheus recorder and mounts
# `/metrics` on the console port behind bearer auth. When empty (and
# `serviceMonitor.enabled=false`), the endpoint is not mounted at all
# and the `metrics::*!` macros become silent no-ops.
metrics:
  serviceMonitor:
    # Set to true ONLY if `kube-prometheus-stack` (or another operator
    # that watches the `ServiceMonitor` CRD) is installed in-cluster.
    # The chart does not include the CRD itself.
    enabled: false
    # Empty → defaults to the release namespace.
    namespace: ""
    # Extra labels applied to the ServiceMonitor. Prometheus is
    # configured to match these (see `prometheus.spec.serviceMonitorSelector`).
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s

# ---- Bundled databases (in-chart StatefulSets) ----
# Set `bundled: false` to use an external service; then set `externalUrl`.

postgres:
  bundled: true
  image: postgres:18-alpine
  user: thinkwatch
  database: think_watch
  # Used only when bundled=false; e.g. postgres://user:pass@host:5432/db.
  # Postgres itself or a pooler in session mode, never transaction mode
  # (see README.md, "PostgreSQL behind a connection pooler").
  externalUrl: ""
  storage: 10Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

redis:
  bundled: true
  image: redis:8-alpine
  # Used only when bundled=false; e.g. redis://:pass@host:6379, or
  # rediss://:pass@host:6379 for a Redis that requires TLS (see README.md)
  externalUrl: ""
  # For a rediss:// externalUrl whose certificate a private CA signed:
  # an existing Secret in the release namespace holding that CA's PEM
  # certificate(s) under `key` (cert-manager keeps it under `ca.crt`).
  # The server then trusts only those certificates for Redis. Empty =
  # the public CAs, which is what managed services need.
  caSecret:
    name: ""
    key: ca.crt
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

clickhouse:
  bundled: true
  image: clickhouse/clickhouse-server:26.3-alpine
  user: thinkwatch
  database: think_watch
  # Used only when bundled=false; e.g. http://host:8123. Plain HTTP only:
  # the server does not connect to ClickHouse over HTTPS (https:// URLs).
  externalUrl: ""
  storage: 20Gi
  storageClassName: ""
  # Mount the chart's optimized config + init SQL ConfigMaps into the bundled
  # ClickHouse pod. Ignored when bundled=false.
  configMaps:
    enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

networkPolicy:
  enabled: false
  # The server may reach PostgreSQL, Redis and ClickHouse on the ports it
  # connects to them on: a bundled service's port, or every port its
  # externalUrl names (each host, each `node=` of a Redis Cluster or
  # Sentinel URL, a Postgres `port=`). Where the URL names no port, the
  # client's default for its scheme: postgres:// 5432; redis:// and
  # rediss:// 6379; a Sentinel 26379, plus 6379 for the primary it points
  # to; ClickHouse's http:// 80. A database on another port, such as Azure
  # Cache for Redis over TLS (rediss://...:6380), needs nothing more than
  # the port in its URL.
  #
  # Egress rules added as written, for ports that no URL names: Redis
  # Cluster nodes announcing ports the URL doesn't list, a Sentinel's
  # primary on a port other than 6379, an upstream, MCP server or S3
  # endpoint on a port other than 443 (RustFS and MinIO: 9000). ClickHouse
  # is reached over plain HTTP only, so its native port 9000 is not allowed.
  extraEgress: []
  #  - ports:
  #      - port: 7000
  #        endPort: 7005
  #        protocol: TCP

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

terminationGracePeriodSeconds: 30

# The server pod's startup probe. The server answers it once it has set up
# the database schema, which instances do one at a time: with several
# replicas starting together (an install, a rollout, an autoscaler adding
# pods), each waits for those before it, and with ClickHouse unreachable
# each retries it for up to about a minute. The defaults give a pod
# 5 + 3 × 40 = 125 s before the kubelet restarts it; raise
# failureThreshold for more replicas than that covers.
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 3
  failureThreshold: 40

podAntiAffinity:
  enabled: true
  type: preferred

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone

resources:
  server:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  web:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
